
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Image Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>My Image Gallery</h1>
        <p>Explore beautiful moments</p>
    </header>

    <main>
        <div class="filters">
            <button onclick="filterImages('all')">All</button>
            <button onclick="filterImages('nature')">Nature</button>
            <button onclick="filterImages('city')">City</button>
            <button onclick="filterImages('animals')">Animals</button>
        </div>

        <div class="gallery" id="gallery"></div>
    </main>

    <div class="lightbox" id="lightbox">
        <button class="close" onclick="closeLightbox()">×</button>
        <button class="prev" onclick="changeImage(-1)">❮</button>
        <img id="lightbox-img" src="" alt="Preview">
        <button class="next" onclick="changeImage(1)">❯</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
